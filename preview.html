<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA Chat - Live Web Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Cairo", sans-serif; background-color: #07090e; color: #fff; }
    .amoled { background-color: #000000 !important; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-4">

  <!-- Android Phone Simulator Container -->
  <div class="w-full max-w-sm h-[740px] bg-[#0c101a] border border-white/10 rounded-[44px] shadow-2xl overflow-hidden flex flex-col relative">
    
    <!-- Phone Status Bar -->
    <div class="px-6 pt-3 pb-1 flex justify-between items-center text-[11px] font-bold text-slate-400 select-none z-20">
      <span>04:40</span>
      <div class="w-20 h-4 bg-black rounded-full mx-auto"></div>
      <div class="flex items-center gap-1.5 text-xs">
        <span>5G</span>
        <span>98%</span>
      </div>
    </div>

    <!-- Dynamic Screens Container -->
    <div id="screen-container" class="flex-1 flex flex-col overflow-hidden relative"></div>

    <!-- Phone Bottom Gesture Bar -->
    <div class="py-1.5 flex justify-center items-center bg-transparent">
      <div class="w-28 h-1 bg-white/20 rounded-full"></div>
    </div>

  </div>

  <script>
    let currentScreen = "auth";
    let currentUser = null;
    let messages = [
      { id: 1, text: "مرحباً بك في تطبيق NOVA Chat!", sender: "other", time: "04:30" },
      { id: 2, text: "هذا هو التصميم الداكن الحقيقي للتطبيق مع Supabase", sender: "other", time: "04:31" },
      { id: 3, text: "أهلاً رضوان، التطبيق رائع وسريع جداً 🚀", sender: "me", time: "04:32" }
    ];

    function render() {
      const container = document.getElementById("screen-container");
      
      if (currentScreen === "auth") {
        container.innerHTML = `
          <div class="flex-1 p-6 flex flex-col justify-between overflow-y-auto">
            <div class="text-center mt-6">
              <div class="w-16 h-16 rounded-3xl bg-blue-600 mx-auto flex items-center justify-center text-white text-2xl font-black shadow-lg shadow-blue-500/30 mb-3">
                N
              </div>
              <h1 class="text-2xl font-black text-white">NOVA Chat</h1>
              <p class="text-xs text-slate-400 mt-1">تطبيق المراسلة المشفرة وسريع الاستجابة</p>
            </div>

            <div class="p-4 rounded-3xl bg-white/5 border border-white/10 flex flex-col gap-3">
              <div>
                <label class="text-[11px] font-bold text-slate-400 block mb-1">الاسم الكامل</label>
                <input id="in-name" type="text" value="رضوان المسوري" class="w-full bg-white/5 border border-white/10 rounded-2xl p-2.5 text-xs text-white outline-none focus:border-blue-500" />
              </div>
              <div>
                <label class="text-[11px] font-bold text-slate-400 block mb-1">البريد الإلكتروني</label>
                <input id="in-email" type="email" value="retwan.pro@gmail.com" class="w-full bg-white/5 border border-white/10 rounded-2xl p-2.5 text-xs text-white outline-none focus:border-blue-500" />
              </div>
              <div>
                <label class="text-[11px] font-bold text-slate-400 block mb-1">كلمة المرور</label>
                <input id="in-pass" type="password" value="12345678" class="w-full bg-white/5 border border-white/10 rounded-2xl p-2.5 text-xs text-white outline-none focus:border-blue-500" />
              </div>

              <button onclick="login()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl text-xs mt-2 transition shadow-lg shadow-blue-500/25">
                تسجيل الدخول / إنشاء حساب
              </button>
            </div>

            <div class="text-center text-[10px] text-slate-500">
              ⚡ متصل بقاعدة بيانات Supabase الحية
            </div>
          </div>
        `;
      } else if (currentScreen === "chats") {
        container.innerHTML = `
          <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <div class="p-4 border-b border-white/10 flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-blue-600 to-cyan-500 flex items-center justify-center font-bold text-sm">
                  ر
                </div>
                <div>
                  <h2 class="text-sm font-bold text-white leading-none">${currentUser ? currentUser.name : "رضوان المسوري"}</h2>
                  <span class="text-[10px] text-emerald-400 font-semibold">متصل الآن • Online</span>
                </div>
              </div>
              <button onclick="currentScreen=auth; render();" class="text-xs text-rose-400 font-semibold px-2 py-1 bg-rose-500/10 rounded-xl">خروج</button>
            </div>

            <!-- Stories Bar -->
            <div class="flex gap-3 px-4 py-3 border-b border-white/5 overflow-x-auto select-none">
              <div class="flex flex-col items-center gap-1 min-w-[50px]">
                <div class="w-12 h-12 rounded-full border-2 border-dashed border-blue-500 flex items-center justify-center text-blue-400 text-xl font-bold">+</div>
                <span class="text-[10px] text-slate-400">قصتك</span>
              </div>
              <div class="flex flex-col items-center gap-1 min-w-[50px]">
                <div class="w-12 h-12 rounded-full border-2 border-emerald-500 p-0.5"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="w-full h-full rounded-full object-cover"/></div>
                <span class="text-[10px] text-slate-400">سارة</span>
              </div>
              <div class="flex flex-col items-center gap-1 min-w-[50px]">
                <div class="w-12 h-12 rounded-full border-2 border-blue-500 p-0.5"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100" class="w-full h-full rounded-full object-cover"/></div>
                <span class="text-[10px] text-slate-400">أحمد</span>
              </div>
            </div>

            <!-- Chats List -->
            <div class="flex-1 overflow-y-auto p-2 space-y-1">
              <div onclick="currentScreen=chat; render();" class="p-3 rounded-2xl bg-white/5 hover:bg-white/10 flex items-center justify-between cursor-pointer transition">
                <div class="flex items-center gap-3">
                  <div class="w-11 h-11 rounded-2xl bg-blue-600 flex items-center justify-center font-bold text-white shadow-md">M</div>
                  <div>
                    <h3 class="text-xs font-bold text-white">Marquesh Developer</h3>
                    <p class="text-[11px] text-slate-400 truncate max-w-[160px]">أهلاً بك في NOVA Chat!</p>
                  </div>
                </div>
                <span class="text-[10px] text-blue-400 font-semibold bg-blue-500/20 px-2 py-0.5 rounded-full">الآن</span>
              </div>

              <div class="p-3 rounded-2xl bg-white/5 hover:bg-white/10 flex items-center justify-between cursor-pointer transition">
                <div class="flex items-center gap-3">
                  <div class="w-11 h-11 rounded-2xl bg-purple-600 flex items-center justify-center font-bold text-white shadow-md">👥</div>
                  <div>
                    <h3 class="text-xs font-bold text-white">مجتمع مطوري أندرويد</h3>
                    <p class="text-[11px] text-slate-400 truncate max-w-[160px]">تم نشر تحديث Kotlin Compose</p>
                  </div>
                </div>
                <span class="text-[10px] text-slate-500">10:45</span>
              </div>
            </div>

            <!-- Bottom Tabs -->
            <div class="p-2 border-t border-white/10 flex justify-around text-xs font-bold text-slate-400 bg-white/5">
              <span class="text-blue-400">💬 الرسائل</span>
              <span>📞 المكالمات</span>
              <span>🚀 المساحات</span>
              <span>⚙️ الإعدادات</span>
            </div>
          </div>
        `;
      } else if (currentScreen === "chat") {
        container.innerHTML = `
          <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Chat Topbar -->
            <div class="p-3 border-b border-white/10 flex items-center justify-between bg-white/5">
              <div class="flex items-center gap-2">
                <button onclick="currentScreen=chats; render();" class="text-lg text-slate-300 font-bold px-1.5">‹</button>
                <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-xs text-white">M</div>
                <div>
                  <h3 class="text-xs font-bold text-white">Marquesh Developer</h3>
                  <span class="text-[9px] text-emerald-400 font-semibold">متصل الآن</span>
                </div>
              </div>
              <div class="flex items-center gap-2 text-xs">
                <span class="p-1.5 bg-white/10 rounded-full cursor-pointer">📞</span>
                <span class="p-1.5 bg-white/10 rounded-full cursor-pointer">📹</span>
              </div>
            </div>

            <!-- Messages Stream -->
            <div id="msg-stream" class="flex-1 overflow-y-auto p-3 space-y-2 flex flex-col">
              ${messages.map(m => `
                <div class="flex ${m.sender === "me" ? "justify-start" : "justify-end"}">
                  <div class="max-w-[78%] p-2.5 rounded-2xl text-xs ${m.sender === "me" ? "bg-blue-600 text-white rounded-br-none" : "bg-white/10 text-slate-200 rounded-bl-none"}">
                    <p>${m.text}</p>
                    <span class="text-[9px] opacity-70 block text-left mt-0.5">${m.time}</span>
                  </div>
                </div>
              `).join("")}
            </div>

            <!-- Message Input -->
            <div class="p-2 border-t border-white/10 flex items-center gap-2 bg-white/5">
              <input id="chat-input" type="text" placeholder="اكتب رسالة مشفرة..." class="flex-1 bg-white/10 rounded-2xl px-3 py-2 text-xs text-white outline-none focus:ring-1 focus:ring-blue-500" onkeydown="if(event.key===Enter) sendMsg()"/>
              <button onclick="sendMsg()" class="w-8 h-8 rounded-full bg-blue-600 hover:bg-blue-500 flex items-center justify-center text-white text-xs font-bold shadow-md">
                ➤
              </button>
            </div>
          </div>
        `;
        setTimeout(() => {
          const el = document.getElementById("msg-stream");
          if(el) el.scrollTop = el.scrollHeight;
        }, 50);
      }
    }

    function login() {
      const name = document.getElementById("in-name").value || "رضوان المسوري";
      currentUser = { name: name };
      currentScreen = "chats";
      render();
    }

    function sendMsg() {
      const inp = document.getElementById("chat-input");
      if(!inp || !inp.value.trim()) return;
      messages.push({
        id: Date.now(),
        text: inp.value.trim(),
        sender: "me",
        time: "الآن"
      });
      render();
    }

    render();
  </script>
</body>
</html>
